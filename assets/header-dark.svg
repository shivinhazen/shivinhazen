      <animate attributeName="stroke-dashoffset" from="0" to="-22" dur="2.8s" repeatCount="indefinite"/>
    </path>

    <circle class="motion" cx="790" cy="126" r="2.6" fill="#58A6FF" opacity="0">
      <animate attributeName="cx" values="790;1110" dur="5.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.08;0.9;1" dur="5.6s" repeatCount="indefinite"/>
