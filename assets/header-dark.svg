      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#30363D" stroke-width="1" opacity="0.42"/>
    </pattern>
    <style>
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
      }
