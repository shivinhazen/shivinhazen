    <circle class="motion" cx="790" cy="126" r="2.1" fill="#58A6FF" opacity="0">
      <animate attributeName="cx" values="790;1110" dur="5.6s" begin="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.08;0.9;1" dur="5.6s" begin="2.8s" repeatCount="indefinite"/>
    </circle>

    <circle cx="768" cy="126" r="9" fill="#0D1117" stroke="#58A6FF" stroke-width="2"/>
    <circle class="motion" cx="768" cy="126" r="12" fill="none" stroke="#58A6FF" stroke-width="1.4" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="9;13;9" dur="3.8s" repeatCount="indefinite"/>
