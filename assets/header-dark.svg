  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="76" fill="#8B949E" font-size="13" font-weight="600" letter-spacing="2.4">LUCAS LEÃO</text>
    <text x="64" y="132" fill="#F0F6FC" font-size="42" font-weight="700" letter-spacing="-1.2">Software Engineer</text>
    <text x="64" y="174" fill="#8B949E" font-size="19" font-weight="500">Full Stack · Data · Applied AI</text>
